<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Registro de Usuario</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5"><!-- Box model: padding -->
    <div class="row justify-content-center"><!-- Flex: centrar -->
      <div class="col-12 col-md-6 col-lg-4">
        <!-- Caja del formulario -->
        <section class="p-4 bg-white rounded shadow-sm">
          <h1 class="h5 text-center mb-4">Registro de Usuario</h1>

          <!-- Skeleton del formulario -->
          <form>
            <!-- Nombre -->
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" placeholder="Ingresa tu nombre">
            </div>

            <!-- Correo -->
            <div class="mb-3">
              <label class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" placeholder="correo@ejemplo.com">
            </div>

            <!-- Contraseña -->
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control" placeholder="********">
            </div>

            <!-- Botón -->
            <div class="d-flex justify-content-center">
              <button type="submit" class="btn btn-primary w-100">Registrarse</button>
            </div>
          </form>
        </section>
      </div>
    </div>
  </div>

</body>
</html>
