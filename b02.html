<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Autenticación de Usuarios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        <section class="p-4 bg-white rounded shadow-sm">
          <h1 class="h5 text-center mb-4">Iniciar Sesión</h1>

          <!-- Skeleton formulario de login -->
          <form>
            <!-- Correo -->
            <div class="mb-3">
              <label class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" placeholder="correo@ejemplo.com">
            </div>

            <!-- Contraseña -->
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control" placeholder="********">
            </div>

            <!-- Botón Iniciar -->
            <div class="d-flex justify-content-center mb-3">
              <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </div>

            <!-- Botón Cerrar Sesión (placeholder, visible tras login) -->
            <div class="d-flex justify-content-center">
              <button type="button" class="btn btn-outline-danger w-100">Cerrar Sesión</button>
            </div>
          </form>
        </section>
      </div>
    </div>
  </div>

</body>
</html>
