<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Armar Pedido (B11)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-4">
    <h1 class="h4 text-center mb-4">Armar Pedido</h1>

    <div class="row g-4">
      <!-- Catálogo -->
      <div class="col-12 col-lg-7">
        <section class="p-3 bg-white rounded shadow-sm">
          <h2 class="h6 mb-3">Productos</h2>
          <div class="row g-3">
            <div class="col-6 col-md-4">
              <div class="card h-100">
                <img src="https://via.placeholder.com/150" class="card-img-top" alt="Producto" />
                <div class="card-body d-flex flex-column">
                  <h5 class="card-title h6">Taco al Pastor</h5>
                  <p class="card-text">$3.500</p>
                  <button class="btn btn-primary mt-auto w-100">Agregar al pedido</button>
                </div>
              </div>
            </div>
            <!-- Más productos… -->
          </div>
        </section>
      </div>

      <!-- Mi pedido -->
      <div class="col-12 col-lg-5">
        <section class="p-3 bg-white rounded shadow-sm">
          <h2 class="h6 mb-3">Mi Pedido</h2>
          <ul class="list-group mb-3">
            <li class="list-group-item d-flex justify-content-between align-items-center">
              Taco al Pastor (x2)
              <span class="fw-semibold">$7.000</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
              Bebida (x1)
              <span class="fw-semibold">$1.500</span>
            </li>
          </ul>
          <div class="d-flex justify-content-between fw-bold">
            <span>Total</span>
            <span>$8.500</span>
          </div>
        </section>
      </div>
    </div>
  </div>
</body>
</html>
