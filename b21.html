<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>B21 · Envío de promociones segmentadas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-4">
    <h1 class="h4 text-center mb-4">Promociones segmentadas</h1>

    <!-- Definición de segmento -->
    <section class="p-3 bg-white rounded shadow-sm mb-3">
      <h2 class="h6 mb-3">Segmento</h2>
      <div class="row g-2">
        <div class="col-12 col-md-4">
          <label class="form-label">Criterio</label>
          <select class="form-select">
            <option>Cumpleaños del mes</option>
            <option>Zona / Comuna</option>
            <option>Historial de compras</option>
            <option>Preferencias declaradas</option>
          </select>
        </div>
        <div class="col-12 col-md-8">
          <label class="form-label">Detalle / Filtro</label>
          <input class="form-control" placeholder="Ej: Comuna = Maipú, ≥ 3 compras, etc.">
        </div>
      </div>
      <div class="alert alert-info mt-3 mb-0">
        * Solo se incluirán clientes con <strong>opt-in</strong> (respeto de consentimientos).
      </div>
    </section>

    <!-- Plantilla de mensaje -->
    <section class="p-3 bg-white rounded shadow-sm mb-3">
      <h2 class="h6 mb-3">Plantilla</h2>
      <div class="row g-2">
        <div class="col-12">
          <label class="form-label">Asunto</label>
          <input class="form-control" placeholder="Ej: ¡Hola {nombre}! Promo {promo}">
        </div>
        <div class="col-12">
          <label class="form-label">Cuerpo</label>
          <textarea class="form-control" rows="5" placeholder="Usa variables como {nombre}, {promo}, {fecha}..."></textarea>
        </div>
      </div>
      <div class="d-flex justify-content-end gap-2 mt-3">
        <button class="btn btn-outline-secondary">Vista previa</button>
        <button class="btn btn-primary">Enviar campaña</button>
      </div>
    </section>

    <!-- Registro de envíos -->
    <section class="p-3 bg-white rounded shadow-sm">
      <h2 class="h6 mb-3">Historial de campañas</h2>
      <div class="table-responsive">
        <table class="table table-sm align-middle">
          <thead class="table-light">
            <tr>
              <th>Fecha/Hora</th><th>Responsable</th><th>Segmento</th><th>Asunto</th><th>Destinatarios</th><th>Estado</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>2025-09-26 19:00</td><td>admin@test.com</td><td>Cumpleaños</td><td>Feliz cumple, {nombre}</td><td>120</td><td><span class="badge text-bg-success">Éxito</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</body>
</html>
