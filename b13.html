<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Validación de Stock (B13)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-4">
    <h1 class="h4 text-center mb-4">Confirmación de Pedido</h1>

    <section class="p-3 bg-white rounded shadow-sm">
      <h2 class="h6 mb-3">Detalle</h2>
      <ul class="list-group mb-3">
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Taco al Pastor (x2)
          <span class="fw-semibold">$7.000</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Bebida (x1) 
          <span class="badge bg-danger">Agotado</span>
        </li>
      </ul>
      <div class="alert alert-danger">
        El producto <strong>Bebida</strong> no está disponible. Ajusta tu pedido para continuar.
      </div>

      <div class="d-flex justify-content-end gap-2">
        <button class="btn btn-outline-secondary">Seguir editando</button>
        <button class="btn btn-primary" disabled>Confirmar pedido</button>
      </div>
    </section>
  </div>
</body>
</html>
