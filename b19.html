<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>B19 · Auditoría de Operaciones</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="h4 text-center mb-4">Bitácora / Auditoría</h1>

    <!-- Filtros -->
    <section class="p-3 bg-white rounded shadow-sm mb-3">
      <div class="row g-2">
        <div class="col-12 col-md-3">
          <label class="form-label">Desde</label>
          <input type="date" class="form-control" />
        </div>
        <div class="col-12 col-md-3">
          <label class="form-label">Hasta</label>
          <input type="date" class="form-control" />
        </div>
        <div class="col-12 col-md-3">
          <label class="form-label">Tipo de operación</label>
          <select class="form-select">
            <option value="">Todas</option><option>Alta</option><option>Baja</option><option>Modificación</option><option>Venta</option><option>Anulación</option>
          </select>
        </div>
        <div class="col-12 col-md-3">
          <label class="form-label">Usuario</label>
          <input type="text" class="form-control" placeholder="correo@ejemplo.com" />
        </div>
      </div>
      <div class="d-flex justify-content-end gap-2 mt-3">
        <button class="btn btn-outline-secondary">Limpiar</button>
        <button class="btn btn-primary">Buscar</button>
      </div>
    </section>

    <!-- Tabla inmutable -->
    <section class="p-3 bg-white rounded shadow-sm">
      <div class="table-responsive">
        <table class="table table-sm align-middle">
          <thead class="table-light">
            <tr>
              <th>Fecha/Hora</th><th>Usuario</th><th>Operación</th><th>Entidad</th><th>Resultado</th><th>Detalle</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>2025-09-26 18:45</td><td>admin@test.com</td><td>Alta</td><td>Cliente #432</td><td><span class="badge text-bg-success">Éxito</span></td><td>Creación de cliente</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="alert alert-info mt-3 mb-0">
        * Inmutabilidad: los registros no son editables ni eliminables por usuarios estándar.
      </div>
    </section>
  </div>
</body>
</html>
