<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Modificar producto (B08)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-4">
    <h1 class="h4 text-center mb-4">Modificar producto</h1>

    <!-- Selector / buscador del producto -->
    <div class="row g-3 mb-3">
      <div class="col-12 col-md-8">
        <input type="text" class="form-control" placeholder="Buscar producto por nombre…" />
      </div>
      <div class="col-12 col-md-4">
        <select class="form-select">
          <option value="">Filtrar por categoría</option>
          <option>Tacos</option><option>Burritos</option><option>Combos</option><option>Bebidas</option>
        </select>
      </div>
    </div>

    <div class="row g-4">
      <!-- Datos actuales / preview -->
      <div class="col-12 col-lg-5">
        <section class="p-3 bg-white rounded shadow-sm">
          <h2 class="h6 mb-3">Producto seleccionado</h2>
          <div class="border rounded p-3">
            <div class="d-flex gap-3">
              <div class="flex-shrink-0" style="width:120px;height:120px;background:#f5f5f5;border-radius:.5rem;"></div>
              <div class="flex-grow-1">
                <p class="m-0 fw-bold">Nombre</p>
                <p class="m-0 text-muted">Categoría</p>
                <p class="m-0">Stock: 0</p>
                <p class="m-0 fw-semibold">$0</p>
              </div>
            </div>
          </div>
        </section>
      </div>

      <!-- Formulario de edición -->
      <div class="col-12 col-lg-7">
        <section class="p-3 bg-white rounded shadow-sm">
          <form class="row g-3">
            <div class="col-12 col-md-6">
              <label class="form-label">Precio</label>
              <input type="number" class="form-control" placeholder="4500" />
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Stock</label>
              <input type="number" class="form-control" placeholder="25" />
            </div>
            <div class="col-12">
              <label class="form-label">Descripción</label>
              <textarea class="form-control" rows="3"></textarea>
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Categoría</label>
              <select class="form-select">
                <option>Tacos</option><option>Burritos</option><option>Combos</option><option>Bebidas</option>
              </select>
            </div>
            <div class="col-12 d-flex gap-2">
              <button type="button" class="btn btn-outline-secondary flex-fill">Descartar cambios</button>
              <button type="submit" class="btn btn-primary flex-fill">Guardar cambios</button>
            </div>
          </form>
        </section>
      </div>
    </div>
  </div>
</body>
</html>
