<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>B25 · Auditoría de usuarios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="h4 text-center mb-4">Bitácora: operaciones sobre usuarios</h1>

    <!-- Filtros -->
    <section class="p-3 bg-white rounded shadow-sm mb-3">
      <div class="row g-2">
        <div class="col-12 col-md-3"><input type="date" class="form-control" /></div>
        <div class="col-12 col-md-3"><input type="date" class="form-control" /></div>
        <div class="col-12 col-md-3">
          <select class="form-select">
            <option value="">Operación</option>
            <option>Alta</option><option>Edición</option><option>Activación</option><option>Desactivación</option><option>Reset</option>
          </select>
        </div>
        <div class="col-12 col-md-3"><input class="form-control" placeholder="Responsable (correo)" /></div>
      </div>
      <div class="d-flex justify-content-end gap-2 mt-3">
        <button class="btn btn-outline-secondary">Limpiar</button>
        <button class="btn btn-primary">Buscar</button>
      </div>
    </section>

    <!-- Tabla de auditoría (inmutable) -->
    <section class="p-3 bg-white rounded shadow-sm">
      <div class="table-responsive">
        <table class="table table-sm align-middle">
          <thead class="table-light">
            <tr>
              <th>Fecha/Hora</th><th>Responsable</th><th>Operación</th><th>Entidad afectada</th><th>Resultado</th><th>Detalle</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>2025-09-26 19:10</td><td>admin@test.com</td><td>Desactivación</td><td>usuario: juan@test.com</td>
              <td><span class="badge text-bg-success">Éxito</span></td><td>Motivo: inactividad</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-3">
        <small class="text-muted">* Registros no editables ni eliminables.</small>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-primary btn-sm">Exportar CSV</button>
          <button class="btn btn-outline-success btn-sm">Exportar PDF</button>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
