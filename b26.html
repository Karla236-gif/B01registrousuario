<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>B26 · Generación y gestión de órdenes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="h4 text-center mb-4">Órdenes de cocina / packing</h1>

    <!-- Listado de órdenes -->
    <section class="p-3 bg-white rounded shadow-sm">
      <div class="d-flex justify-content-between mb-3">
        <h2 class="h6 m-0">Órdenes generadas</h2>
        <button class="btn btn-outline-primary btn-sm">Reintentar última</button>
      </div>

      <div class="table-responsive">
        <table class="table table-sm align-middle">
          <thead class="table-light">
            <tr>
              <th>Pedido</th><th>Hora confirmación</th><th>Ítems</th><th>Estado</th><th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>#1023</td>
              <td>18:40</td>
              <td>2 Tacos, 1 Bebida</td>
              <td><span class="badge text-bg-success">Generada</span></td>
              <td class="text-end">
                <div class="d-inline-flex gap-2">
                  <button class="btn btn-outline-secondary btn-sm">Ver</button>
                  <button class="btn btn-outline-primary btn-sm">Imprimir</button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="alert alert-danger mt-3 mb-0">
        * Placeholder: error al generar orden, pendiente de reintento.
      </div>
    </section>
  </div>
</body>
</html>
