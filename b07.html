<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Agregar producto (B07)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="h4 text-center mb-4">Agregar producto</h1>

    <div class="row g-4">
      <!-- Formulario -->
      <div class="col-12 col-lg-7">
        <section class="p-3 bg-white rounded shadow-sm">
          <form class="row g-3">
            <div class="col-12">
              <label class="form-label">Nombre *</label>
              <input type="text" class="form-control" placeholder="Ej: Taco al Pastor" />
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Precio *</label>
              <input type="number" class="form-control" placeholder="3500" />
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Categoría *</label>
              <select class="form-select">
                <option value="">Selecciona…</option>
                <option>Tacos</option><option>Burritos</option><option>Combos</option><option>Bebidas</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Descripción (opcional)</label>
              <textarea class="form-control" rows="3" placeholder="Ingredientes, notas, etc."></textarea>
            </div>
            <div class="col-12">
              <label class="form-label">Imagen (opcional)</label>
              <input type="file" class="form-control" />
            </div>
            <div class="col-12 d-flex align-items-center gap-2">
              <input id="activo" type="checkbox" class="form-check-input" checked />
              <label for="activo" class="form-check-label">Marcar como activo</label>
            </div>
            <div class="col-12 d-flex gap-2">
              <button type="button" class="btn btn-secondary flex-fill">Guardar borrador</button>
              <button type="submit" class="btn btn-primary flex-fill">Guardar producto</button>
            </div>
          </form>
        </section>
      </div>

      <!-- Previsualización -->
      <div class="col-12 col-lg-5">
        <section class="p-3 bg-white rounded shadow-sm">
          <h2 class="h6 mb-3">Previsualización</h2>
          <div class="border rounded d-flex justify-content-center align-items-center p-4" style="min-height: 220px;">
            <span class="text-muted">Imagen del producto</span>
          </div>
          <div class="mt-3">
            <p class="m-0 fw-bold">Nombre del producto</p>
            <p class="m-0 text-muted">Categoría</p>
            <p class="m-0 fs-5 fw-semibold">$0</p>
          </div>
        </section>
      </div>
    </div>
  </div>
</body>
</html>
