<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>B27 · Seguimiento de pedidos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-4">
    <h1 class="h4 text-center mb-4">Seguimiento de pedidos</h1>

    <div class="row g-4">
      <!-- Panel cliente -->
      <div class="col-12 col-lg-6">
        <section class="p-3 bg-white rounded shadow-sm">
          <h2 class="h6 mb-3">Vista cliente</h2>
          <p class="fw-bold">Pedido #1023</p>
          <ul class="list-group mb-3">
            <li class="list-group-item d-flex justify-content-between align-items-center">
              Pendiente <span class="badge text-bg-success">✔</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
              En preparación <span class="badge text-bg-success">✔</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
              En ruta <span class="badge text-bg-warning">Actual</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
              Entregado <span class="badge text-bg-secondary">Pendiente</span>
            </li>
          </ul>
        </section>
      </div>

      <!-- Panel staff -->
      <div class="col-12 col-lg-6">
        <section class="p-3 bg-white rounded shadow-sm">
          <h2 class="h6 mb-3">Vista staff</h2>
          <p class="fw-bold">Pedido #1023</p>
          <div class="d-flex gap-2 flex-wrap">
            <button class="btn btn-outline-secondary">Pendiente</button>
            <button class="btn btn-outline-primary">En preparación</button>
            <button class="btn btn-outline-warning">En ruta</button>
            <button class="btn btn-outline-success">Entregado</button>
          </div>
          <div class="alert alert-info mt-3 mb-0">
            * Cambios quedan trazados con usuario + hora.
          </div>
        </section>
      </div>
    </div>
  </div>
</body>
</html>
