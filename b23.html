<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>B23 · Gestión de cuentas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="h4 text-center mb-4">Gestión de cuentas de usuario</h1>

    <div class="row g-4">
      <!-- Alta / Edición -->
      <div class="col-12 col-lg-6">
        <section class="p-3 bg-white rounded shadow-sm">
          <h2 class="h6 mb-3">Alta / Edición</h2>
          <form class="row g-2">
            <div class="col-12">
              <label class="form-label">Nombre *</label>
              <input class="form-control" placeholder="Nombre y apellido" />
            </div>
            <div class="col-12">
              <label class="form-label">Correo (único) *</label>
              <input type="email" class="form-control" placeholder="correo@ejemplo.com" />
              <div class="form-text">* Validación de formato y unicidad.</div>
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Rol *</label>
              <select class="form-select">
                <option>Administrador</option><option>Cajero</option><option>Despacho</option><option>Dueñ@</option><option>Cliente</option>
              </select>
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Estado *</label>
              <select class="form-select">
                <option>Activo</option><option>Inactivo</option>
              </select>
            </div>
            <div class="col-12 d-flex gap-2">
              <button type="button" class="btn btn-outline-secondary flex-fill">Limpiar</button>
              <button type="button" class="btn btn-primary flex-fill">Guardar</button>
            </div>
            <div class="col-12">
              <div class="alert alert-danger m-0">* Placeholder: correo ya registrado.</div>
            </div>
          </form>
        </section>
      </div>

      <!-- Listado / Búsqueda -->
      <div class="col-12 col-lg-6">
        <section class="p-3 bg-white rounded shadow-sm">
          <h2 class="h6 mb-3">Usuarios</h2>
          <div class="input-group mb-3">
            <input class="form-control" placeholder="Buscar por nombre/correo" />
            <button class="btn btn-outline-secondary">Buscar</button>
          </div>
          <div class="table-responsive">
            <table class="table table-sm align-middle">
              <thead class="table-light">
                <tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th class="text-end">Acciones</th></tr>
              </thead>
              <tbody>
                <tr>
                  <td>Juan Pérez</td><td>juan@test.com</td><td>Cajero</td>
                  <td><span class="badge text-bg-success">Activo</span></td>
                  <td class="text-end">
                    <div class="d-inline-flex gap-2">
                      <button class="btn btn-outline-secondary btn-sm">Editar</button>
                      <button class="btn btn-outline-info btn-sm">Cambiar rol</button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="alert alert-info mt-3 mb-0">* Registrar quién creó/editó y cuándo (auditoría).</div>
        </section>
      </div>
    </div>
  </div>
</body>
</html>
