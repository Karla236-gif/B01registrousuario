<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>B24 · Control de acceso</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-4">
    <h1 class="h4 text-center mb-4">Control de acceso y seguridad</h1>

    <!-- Buscar usuario -->
    <section class="p-3 bg-white rounded shadow-sm mb-3">
      <h2 class="h6 mb-3">Buscar usuario</h2>
      <div class="row g-2">
        <div class="col-12 col-md-8"><input class="form-control" placeholder="correo@ejemplo.com" /></div>
        <div class="col-12 col-md-4 d-grid"><button class="btn btn-outline-secondary">Consultar</button></div>
      </div>
    </section>

    <!-- Acciones de seguridad -->
    <section class="p-3 bg-white rounded shadow-sm">
      <div class="row g-4">
        <div class="col-12 col-lg-6">
          <h2 class="h6 mb-3">Estado y bloqueo</h2>
          <div class="d-flex align-items-center gap-3 mb-3">
            <span class="badge text-bg-success">Activo</span>
            <span class="badge text-bg-secondary">Intentos fallidos: 0/5</span>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-warning">Desactivar cuenta</button>
            <button class="btn btn-outline-warning">Bloquear</button>
          </div>
          <div class="alert alert-info mt-3 mb-0">
            * Al desactivar/bloquear: invalidar sesiones activas.
          </div>
        </div>

        <div class="col-12 col-lg-6">
          <h2 class="h6 mb-3">Reset de contraseña</h2>
          <p class="text-muted mb-2">Envia enlace/token temporal al correo del usuario.</p>
          <button class="btn btn-primary">Restablecer contraseña</button>
          <div class="alert alert-success mt-3 mb-0">* Placeholder: enlace enviado al correo.</div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
