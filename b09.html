<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Eliminar / Inactivar producto (B09)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-4">
    <h1 class="h4 text-center mb-4">Eliminar / Inactivar producto</h1>

    <!-- Tabla simple de productos -->
    <div class="table-responsive bg-white rounded shadow-sm">
      <table class="table table-sm align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Producto</th><th>Categoría</th><th>Estado</th><th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Taco al Pastor</td><td>Tacos</td><td><span class="badge text-bg-success">Activo</span></td>
            <td class="text-end">
              <div class="d-inline-flex gap-2">
                <button class="btn btn-outline-warning btn-sm">Inactivar</button>
                <button class="btn btn-outline-danger btn-sm">Eliminar permanente</button>
              </div>
            </td>
          </tr>
          <tr>
            <td>Burrito Veggie</td><td>Burritos</td><td><span class="badge text-bg-secondary">Inactivo</span></td>
            <td class="text-end">
              <div class="d-inline-flex gap-2">
                <button class="btn btn-outline-success btn-sm">Reactivar</button>
                <button class="btn btn-outline-danger btn-sm">Eliminar permanente</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Placeholder de modal de confirmación -->
    <div class="alert alert-warning mt-3 mb-0" role="alert">
      * Placeholder: aquí iría un modal para confirmar Inactivar/Eliminar y registrar auditoría.
    </div>
  </div>
</body>
</html>
