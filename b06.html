<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Detalle de Producto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container py-5">
    <div class="row g-4">
      <!-- Imagen -->
      <div class="col-12 col-md-6">
        <img src="https://via.placeholder.com/400" class="img-fluid rounded" alt="Producto">
      </div>

      <!-- Información -->
      <div class="col-12 col-md-6">
        <h1 class="h4">Nombre del Producto</h1>
        <p class="text-muted">Ingredientes: tortilla, carne, salsa.</p>
        <p class="text-danger">Alérgenos: gluten</p>
        <p class="fs-5 fw-bold">$7.990</p>
        <p class="text-success">Disponible</p>

        <!-- Botón de acción -->
        <button class="btn btn-primary w-100">Agregar al carrito</button>
      </div>
    </div>
  </div>

</body>
</html>
