<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>B18 · Gestión de Clientes y Usuarios</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-4">
    <h1 class="h4 text-center mb-4">Gestión de clientes y usuarios</h1>

    <!-- Tabs Clientes / Usuarios -->
    <ul class="nav nav-pills mb-3 gap-2 justify-content-center">
      <li class="nav-item"><button class="nav-link active">Clientes</button></li>
      <li class="nav-item"><button class="nav-link">Usuarios del sistema</button></li>
    </ul>

    <div class="row g-4">
      <!-- Panel Clientes -->
      <div class="col-12 col-lg-6">
        <section class="p-3 bg-white rounded shadow-sm">
          <h2 class="h6 mb-3">Clientes</h2>
          <!-- Form ABM Clientes -->
          <form class="row g-2 mb-3">
            <div class="col-12 col-md-6">
              <label class="form-label">Nombre *</label>
              <input class="form-control" type="text" placeholder="Nombre y apellido" />
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Correo *</label>
              <input class="form-control" type="email" placeholder="correo@ejemplo.com" />
              <div class="form-text">* Validación por API externa</div>
            </div>
            <div class="col-12 d-flex gap-2">
              <button class="btn btn-secondary flex-fill" type="button">Limpiar</button>
              <button class="btn btn-primary flex-fill" type="button">Guardar</button>
            </div>
          </form>

          <!-- Lista Clientes -->
          <div class="table-responsive">
            <table class="table table-sm align-middle">
              <thead class="table-light">
                <tr><th>Nombre</th><th>Correo</th><th>Estado</th><th class="text-end">Acciones</th></tr>
              </thead>
              <tbody>
                <tr>
                  <td>Juan Pérez</td><td>juan@test.com</td><td><span class="badge text-bg-success">Activo</span></td>
                  <td class="text-end">
                    <div class="d-inline-flex gap-2">
                      <button class="btn btn-outline-secondary btn-sm">Editar</button>
                      <button class="btn btn-outline-warning btn-sm">Desactivar</button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>

      <!-- Panel Usuarios -->
      <div class="col-12 col-lg-6">
        <section class="p-3 bg-white rounded shadow-sm">
          <h2 class="h6 mb-3">Usuarios del sistema</h2>
          <!-- Form ABM Usuarios -->
          <form class="row g-2 mb-3">
            <div class="col-12 col-md-6">
              <label class="form-label">Usuario *</label>
              <input class="form-control" type="text" placeholder="usuario@dominio" />
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Rol *</label>
              <select class="form-select">
                <option>Administrador</option><option>Cajero</option><option>Despacho</option><option>Dueñ@</option>
              </select>
            </div>
            <div class="col-12 d-flex gap-2">
              <button class="btn btn-secondary flex-fill" type="button">Limpiar</button>
              <button class="btn btn-primary flex-fill" type="button">Guardar</button>
            </div>
          </form>

          <!-- Lista Usuarios -->
          <div class="table-responsive">
            <table class="table table-sm align-middle">
              <thead class="table-light">
                <tr><th>Usuario</th><th>Rol</th><th>Estado</th><th class="text-end">Acciones</th></tr>
              </thead>
              <tbody>
                <tr>
                  <td>admin@test.com</td><td>Administrador</td><td><span class="badge text-bg-success">Activo</span></td>
                  <td class="text-end">
                    <div class="d-inline-flex gap-2">
                      <button class="btn btn-outline-secondary btn-sm">Editar</button>
                      <button class="btn btn-outline-warning btn-sm">Desactivar</button>
                      <button class="btn btn-outline-info btn-sm">Cambiar rol</button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="alert alert-warning mt-3 mb-0">
            * Control de acceso: solo perfiles autorizados pueden ver/editar estos mantenedores.
          </div>
        </section>
      </div>
    </div>
  </div>
</body>
</html>
