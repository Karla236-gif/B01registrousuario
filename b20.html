<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>B20 · Registro y validación de clientes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="h4 text-center mb-4">Registro / Actualización de Clientes</h1>

    <div class="row g-4">
      <!-- Formulario -->
      <div class="col-12 col-lg-7">
        <section class="p-3 bg-white rounded shadow-sm">
          <form class="row g-3">
            <div class="col-12 col-md-6">
              <label class="form-label">Nombre *</label>
              <input type="text" class="form-control" placeholder="Nombre y apellido">
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Correo *</label>
              <div class="input-group">
                <input type="email" class="form-control" placeholder="correo@ejemplo.com">
                <span class="input-group-text">Estado</span>
              </div>
              <div class="form-text">* Se valida formato y existencia por API.</div>
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Teléfono *</label>
              <input type="tel" class="form-control" placeholder="912345678">
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Fecha de nacimiento (opcional)</label>
              <input type="date" class="form-control">
            </div>
            <div class="col-12">
              <label class="form-label">Dirección (opcional)</label>
              <input type="text" class="form-control" placeholder="Calle, número, depto">
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Comuna</label>
              <input type="text" class="form-control" placeholder="Comuna">
            </div>
            <div class="col-12 col-md-6">
              <label class="form-label">Región</label>
              <input type="text" class="form-control" placeholder="Región">
            </div>
            <div class="col-12 d-flex gap-2">
              <button type="button" class="btn btn-outline-secondary flex-fill">Limpiar</button>
              <button type="submit" class="btn btn-primary flex-fill">Guardar</button>
            </div>
            <div class="col-12">
              <div class="alert alert-danger m-0" role="alert">
                * Placeholder error: correo no válido según API (bloquear guardado).
              </div>
            </div>
          </form>
        </section>
      </div>

      <!-- Lista / búsqueda -->
      <div class="col-12 col-lg-5">
        <section class="p-3 bg-white rounded shadow-sm">
          <h2 class="h6 mb-3">Clientes registrados</h2>
          <div class="input-group mb-3">
            <input class="form-control" placeholder="Buscar por nombre o correo">
            <button class="btn btn-outline-secondary">Buscar</button>
          </div>
          <div class="table-responsive">
            <table class="table table-sm align-middle">
              <thead class="table-light">
                <tr><th>Nombre</th><th>Correo</th><th>Verificación</th><th class="text-end">Acciones</th></tr>
              </thead>
              <tbody>
                <tr>
                  <td>Juan Pérez</td><td>juan@test.com</td><td><span class="badge text-bg-success">Verificado</span></td>
                  <td class="text-end"><button class="btn btn-outline-secondary btn-sm">Editar</button></td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </div>
</body>
</html>
