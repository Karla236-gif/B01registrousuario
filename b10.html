<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Disponibilidad en tiempo real (B10)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-4">
    <h1 class="h4 text-center mb-4">Disponibilidad de productos</h1>

    <!-- Barra de búsqueda/filtrado -->
    <div class="row g-2 mb-3">
      <div class="col-12 col-md-8">
        <input class="form-control" type="text" placeholder="Buscar producto…" />
      </div>
      <div class="col-12 col-md-4">
        <select class="form-select">
          <option value="">Filtrar por categoría</option>
          <option>Tacos</option><option>Burritos</option><option>Combos</option><option>Bebidas</option>
        </select>
      </div>
    </div>

    <!-- Lista (cards) con indicador de stock -->
    <div class="row g-3">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100">
          <div class="card-body d-flex flex-column">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <h2 class="h6 m-0">Taco al Pastor</h2>
              <span class="badge text-bg-success">Disponible</span>
            </div>
            <p class="text-muted mb-3">Stock: 10</p>
            <div class="mt-auto d-flex gap-2">
              <button class="btn btn-outline-secondary btn-sm flex-fill">-1 venta</button>
              <button class="btn btn-outline-primary btn-sm flex-fill">+1 reponer</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Más items… -->
      <div class="col-12">
        <div class="alert alert-info m-0" role="alert">
          * Placeholder: cambios deben reflejarse inmediatamente en catálogo y detalle; bloquear “Agregar” si no hay stock.
        </div>
      </div>
    </div>
  </div>
</body>
</html>
